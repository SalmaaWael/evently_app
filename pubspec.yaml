name: evently_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  toggle_switch: ^2.3.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.2.0
  path_provider: ^2.1.1
  provider: ^6.1.5
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.3.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/evently_logo.png"
  min_sdk_android: 21